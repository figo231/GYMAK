name: Remove expired one-shot release transport
on:
  push:
    branches: [stage/apk25-private]
    paths: [.github/workflows/cleanup34.yml]
permissions:
  contents: write
  actions: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retain recoverable private rollback evidence with permanent backup key
        env:
          GH_TOKEN: ${{ github.token }}
          TRANSPORT: ${{ secrets.GYMAK_CANDIDATE32_TRANSPORT }}
          BACKUP_KEY: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          test -n "$BACKUP_KEY"
          mkdir -p "$RUNNER_TEMP/retained34/backup" "$RUNNER_TEMP/retained34/execution"
          gh run download 45570268266 -R figo231/GYMAK -n encrypted-private-db-proof -D "$RUNNER_TEMP/retained34/backup"
          gh run download 45570834360 -R figo231/GYMAK -n encrypted-selected34-execution -D "$RUNNER_TEMP/retained34/execution"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$RUNNER_TEMP/retained34/backup/db-proof.enc" -out "$RUNNER_TEMP/retained34/backup/db-proof.tar.gz" -pass env:TRANSPORT
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$RUNNER_TEMP/retained34/execution/apply34-proof.enc" -out "$RUNNER_TEMP/retained34/execution/apply34-proof.tar.gz" -pass env:TRANSPORT
          rm "$RUNNER_TEMP/retained34/backup/db-proof.enc" "$RUNNER_TEMP/retained34/execution/apply34-proof.enc"
          tar -czf "$RUNNER_TEMP/retained34.tar.gz" -C "$RUNNER_TEMP" retained34
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -in "$RUNNER_TEMP/retained34.tar.gz" -out "$RUNNER_TEMP/gymak34-private-rollback.enc" -pass env:BACKUP_KEY
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$RUNNER_TEMP/gymak34-private-rollback.enc" -out "$RUNNER_TEMP/verified34.tar.gz" -pass env:BACKUP_KEY
          cmp "$RUNNER_TEMP/retained34.tar.gz" "$RUNNER_TEMP/verified34.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: gymak34-private-rollback
          path: ${{ runner.temp }}/gymak34-private-rollback.enc
          retention-days: 30
      - name: Remove one-shot ciphertext and automation from current branch
        run: |
          git rm --ignore-unmatch c32-0.txt c32-1.txt c32-2.txt c32-3.txt c32-4.txt c33-0.txt c33-1.txt c33-2.txt c33-3.txt c33-4.txt c34-overlay.txt apply34-cipher.txt .github/workflows/candidate32-verify.yml .github/workflows/candidate33-canary.yml .github/workflows/candidate34-final.yml .github/workflows/apply34-once.yml .github/workflows/publish34-final.yml .github/workflows/cleanup34.yml
          git config user.name 'figo231'
          git config user.email '89879739+figo231@users.noreply.github.com'
          git diff --cached --quiet || git commit -m 'Remove temporary release34 transport and one-shot automation'
          git push origin HEAD:stage/apk25-private
