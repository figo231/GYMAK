name: Verify committed additive27 production state read-only
on:
  push:
    branches: [stage/apk25-private]
    paths: [.github/workflows/postflight27.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check production additions, RLS and unchanged control
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          docker run --rm -i -e DB_URL postgres:17 bash -c 'apt-get update -qq >/tmp/install.log 2>&1 && apt-get install -y -qq python3 >>/tmp/install.log 2>&1 && python3 -' <<'PY'
          import os,subprocess as sp
          from urllib.parse import quote
          raw=os.environ['DB_URL'];credentials,hostpart=raw.split('://',1)[1].rsplit('@',1);username,password=credentials.split(':',1)
          env=os.environ.copy();env['PGPASSWORD']=password;url=raw.split('://',1)[0]+'://'+quote(username,safe='')+'@'+hostpart
          checks={
          'release_objects':"select to_regclass('public.private_draft_revisions') is not null and to_regprocedure('public.sync_mutable_row_v1(text,text,jsonb,jsonb,boolean)') is not null and to_regclass('public.friend_preferences') is not null and to_regclass('public.private_account_age') is not null",
          'exercise_columns':"select count(*)=2 from information_schema.columns where table_schema='public' and table_name='exercise_logs' and column_name in ('rir','client_logged_at')",
          'rls':"select bool_and(rowsecurity) from pg_tables where schemaname='public'",
          'owner_control_preserved':"select enabled from public.owner_push_control limit 1",
          'private_age_not_in_profiles':"select not exists(select 1 from information_schema.columns where table_schema='public' and table_name='profiles' and column_name in ('age','private_age'))",
          'private_draft_owner_policy':"select count(*)=3 from pg_policies where schemaname='public' and tablename='private_draft_revisions'",
          'age_owner_policies':"select count(*)=4 from pg_policies where schemaname='public' and tablename='private_account_age'"
          }
          for name,q in checks.items():
           r=sp.run(['psql',url,'-X','-v','ON_ERROR_STOP=1','-tAc',q],env=env,text=True,stdout=sp.PIPE,stderr=sp.PIPE)
           assert r.returncode==0,'Private read-only check failed'
           assert r.stdout.strip()=='t','Postflight failed: '+name
           print('PASS',name)
          print('Read-only production postflight passed. No writes or sends performed.')
          PY
