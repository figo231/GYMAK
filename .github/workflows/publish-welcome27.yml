name: Publish approved welcome27 only
on:
  push:
    branches: [stage/apk25-private]
    paths: [.github/workflows/publish-welcome27.yml]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Require committed and independently verified production migrations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/figo231/GYMAK/actions/runs/45555062470 --jq .conclusion)" = success
          test "$(gh api repos/figo231/GYMAK/actions/runs/45555368425 --jq .conclusion)" = success
      - name: Require live verified web27 first
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api repos/figo231/GYMAK/actions/runs/45555842439 --jq .conclusion)" = success
      - name: Recover exact tested bytes without rebuilding or signing
        env:
          GH_TOKEN: ${{ github.token }}
          TRANSPORT: ${{ secrets.GYMAK_APPLY27_TRANSPORT }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pub27"
          base64 -d publish27-cipher.txt > "$RUNNER_TEMP/pub27.enc"
          echo '0a3dd117b1eeb3a7358bb5ee6655d1aa9248e6e0e949a6408d8e5e3b2bbcbac6  '"$RUNNER_TEMP/pub27.enc" | sha256sum -c -
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$RUNNER_TEMP/pub27.enc" -out "$RUNNER_TEMP/pub27.tar.gz" -pass env:TRANSPORT
          tar -xzf "$RUNNER_TEMP/pub27.tar.gz" -C "$RUNNER_TEMP/pub27"
          gh run download 45549648262 -R figo231/GYMAK -n apk27-encrypted-verification -D "$RUNNER_TEMP/pub27"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$RUNNER_TEMP/pub27/apk27-evidence.enc" -out "$RUNNER_TEMP/evidence.tar.gz" -pass file:"$RUNNER_TEMP/pub27/evidence.key"
          tar -xzf "$RUNNER_TEMP/evidence.tar.gz" -C "$RUNNER_TEMP/pub27"
          cd "$RUNNER_TEMP/pub27/verification"
          echo '983e20cd362c5f60592ec2138dc09a5ed98b2a94adecd434f01e19adb9825e13  exact.zip' | sha256sum -c -
          echo '5c7668c13d893574fab2d4b96c31ef72bd2869e289dbb5b743d0d05becbef9f5  exact/bundle.zip' | sha256sum -c -
      - name: Publish only approved welcome overlay
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/pub27"
          echo 'ee5073ab15ab4cd5b1ff484ad93766884926c3c00be9e35b237efcdc83f03b4a  landing.html' | sha256sum -c -
          cd "$GITHUB_WORKSPACE"
          git fetch origin web-production
          git checkout -B welcome27 origin/web-production
          cp "$RUNNER_TEMP/pub27/landing.html" public/landing.html
          cp "$RUNNER_TEMP/pub27/landing/"*.webp public/landing/
          git config user.name 'figo231'
          git config user.email '89879739+figo231@users.noreply.github.com'
          git add public/landing.html public/landing/apk27-*.webp
          git commit -m 'Publish approved additive welcome27 section preserving existing page'
          git push origin HEAD:web-production
          echo "WELCOME27 commit $(git rev-parse HEAD)"
      - name: Verify live exact approved page, assets, OTA and download
        run: |
          set -euo pipefail
          for n in $(seq 1 40); do
            curl -fsSL https://gymak-eight.vercel.app/welcome -o "$RUNNER_TEMP/live-welcome.html"
            if cmp -s "$RUNNER_TEMP/live-welcome.html" "$RUNNER_TEMP/pub27/landing.html"; then break; fi
            sleep 15
          done
          cmp "$RUNNER_TEMP/live-welcome.html" "$RUNNER_TEMP/pub27/landing.html"
          for name in age meals month swap; do
            curl -fsSL "https://gymak-eight.vercel.app/landing/apk27-$name.webp" -o "$RUNNER_TEMP/asset.webp"
            cmp "$RUNNER_TEMP/asset.webp" "$RUNNER_TEMP/pub27/landing/apk27-$name.webp"
          done
          curl -fsSL https://gymak-eight.vercel.app/ota/stable.json -o "$RUNNER_TEMP/live-stable.json"
          cmp "$RUNNER_TEMP/live-stable.json" "$RUNNER_TEMP/pub27/verification/exact/stable.json"
          curl -fsSL https://gymak-eight.vercel.app/download/GYMAK.apk -o "$RUNNER_TEMP/current.apk"
          echo 'af9dc51aaf1534b857991e39569136ee0b6dd6022dfece6e157ce667bcc1cb53  '"$RUNNER_TEMP/current.apk" | sha256sum -c -
          echo 'LIVE approved welcome27, all image bytes, OTA and retained APK26 verified.'
      - name: Clear temporary staging files and workflows
        run: |
          set -euo pipefail
          git fetch origin stage/apk25-private
          git checkout -B cleanup27 origin/stage/apk25-private
          git rm --ignore-unmatch publish27-cipher.txt .github/workflows/publish-ota27.yml .github/workflows/publish-web27.yml .github/workflows/publish-welcome27.yml .github/workflows/postflight27.yml
          git commit -m 'Remove temporary transport and release workflows after verified rollout'
          git push origin HEAD:stage/apk25-private
      - name: Clear runner plaintext
        if: always()
        run: rm -rf "$RUNNER_TEMP/pub27" "$RUNNER_TEMP/pub27.enc" "$RUNNER_TEMP/pub27.tar.gz" "$RUNNER_TEMP/evidence.tar.gz" "$RUNNER_TEMP/current.apk"
