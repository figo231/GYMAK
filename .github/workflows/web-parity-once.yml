name: Apply approved web parity fix
on:
  push:
    paths: ['.github/workflows/web-parity-once.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply tested web-only changes
        env:
          PATCH: ""
        run: |
          printf '%s' "$PATCH" | base64 -d > /tmp/web.patch
          git apply --check /tmp/web.patch
          git apply /tmp/web.patch
          git config user.name 'Instinct Agent'
          git config user.email 'agent@instinct.com'
          git add -A
          git commit -m 'Keep welcome in browser and pair web with approved releases'
          git push origin HEAD:refs/heads/web-production
