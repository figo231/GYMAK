name: Recover approved APK22 web publication
on:
  push:
    branches: [web-production]
    paths: ['.github/workflows/web-parity-once.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish exact verified APK22 runtime
        run: |
          git rm -r --ignore-unmatch . ':!.github/workflows'
          git checkout c4fc27d3ec0b8582c2c28dfcb3035dcdf4018e7b -- . ':!.github/workflows'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --quiet || git commit -m 'Publish verified APK22 runtime and same-domain download'
          git push origin HEAD:web-production
