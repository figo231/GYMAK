name: Prepare approved APK22 source
on:
  push:
    paths: ['.github/workflows/web-parity-once.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified APK22 source
        env:
          PATCH: ""
        run: |
          printf '%s' "$PATCH" | base64 -d > /tmp/source.patch
          git apply --check /tmp/source.patch
          git apply /tmp/source.patch
          git config user.name 'Instinct Agent'
          git config user.email 'agent@instinct.com'
          git add -A
          git commit -m 'Prepare approved APK22 tour, 23 guides and owner panel fixes'
          git push origin HEAD:refs/heads/release/apk-22
