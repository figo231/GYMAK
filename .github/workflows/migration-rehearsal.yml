name: Private migration rehearsal only
on:
  push:
    branches: [stage/apk25-private]
    paths: [.github/workflows/migration-rehearsal.yml]
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      restore:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: restoretest
        ports: ['5433:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Decrypt private verification helper
        env:
          SOURCE_KEY: ${{ secrets.GYMAK_APK27_SOURCE_KEY }}
        run: |
          base64 -d canary2-delta.txt > "$RUNNER_TEMP/source.enc"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$RUNNER_TEMP/source.enc" -out "$RUNNER_TEMP/source.tar.gz" -pass env:SOURCE_KEY
          tar -xzf "$RUNNER_TEMP/source.tar.gz" -C "$RUNNER_TEMP"
          python3 - <<'PYFIX'
          import os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'backup-verify.py'
          s=p.read_text().replace("'--exclude-table-data=auth.mfa_challenges'","'--exclude-table-data=auth.mfa_amr_claims','--exclude-table-data=auth.mfa_challenges'").replace("'auth.mfa_challenges','auth.audit_log_entries'","'auth.mfa_amr_claims','auth.mfa_challenges','auth.audit_log_entries'")
          p.write_text(s)
          PYFIX
      - name: Strict read-only source backup and isolated restore
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p "$RUNNER_TEMP/db-proof"
          docker run --rm --network host -e DB_URL -e RUNNER_TEMP -v "$RUNNER_TEMP:$RUNNER_TEMP" postgres:17 bash -c 'apt-get update && apt-get install -y python3 && psql postgresql://postgres:restoretest@localhost:5433/postgres -v ON_ERROR_STOP=1 -c "drop schema public cascade;" && python3 "$RUNNER_TEMP/backup-verify.py"' > "$RUNNER_TEMP/db-proof/result.txt" 2>&1
      - name: Rehearse only on disposable restored database
        run: |
          git fetch origin tag apk-26
          git checkout --detach apk-26
          git apply "$RUNNER_TEMP/candidate.patch"
          cat > "$RUNNER_TEMP/rehearse.py" <<'PYREHEARSE'
          import subprocess as sp,os,pathlib,json
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'db-proof';url='postgresql://postgres:restoretest@localhost:5433/postgres'
          def q(sql):return sp.check_output(['psql',url,'-X','-v','ON_ERROR_STOP=1','-tAc',sql],text=True).strip()
          tables=q("select quote_ident(schemaname)||'.'||quote_ident(tablename) from pg_tables where schemaname in ('public','auth','storage') order by 1").splitlines()
          def hashes():return {t:q("select md5(coalesce(string_agg(x::text,'' order by x::text),'')) from (select to_jsonb(r) x from "+t+" r) s") for t in tables}
          before=hashes()
          schema=sp.check_output(['pg_dump',url,'--schema-only','--no-owner'],text=True)
          (out/'before-schema.sql').write_text(schema)
          paths=[]
          for n in ['0052','0053','0054','0055','0057','0058']:paths+=list(pathlib.Path('supabase/migrations').glob(n+'*.sql'))
          sql='\n'.join(p.read_text().replace('begin;','').replace('commit;','') for p in paths)
          (out/'forward.sql').write_text(sql)
          sp.run(['psql',url,'-X','-v','ON_ERROR_STOP=1'],input='BEGIN;\n'+sql+'\nROLLBACK;',text=True,check=True,stdout=open(out/'rollback-rehearsal.txt','w'),stderr=sp.STDOUT)
          assert hashes()==before,'rollback changed source rows'
          # Schema equality ignores pg_dump randomized restrict/unrestrict markers only.
          def normalized(s):return '\n'.join(l for l in s.splitlines() if not l.startswith('\\restrict ') and not l.startswith('\\unrestrict '))
          assert normalized(sp.check_output(['pg_dump',url,'--schema-only','--no-owner'],text=True))==normalized(schema),'rollback schema differs'
          sp.run(['psql',url,'-X','-v','ON_ERROR_STOP=1','-1'],input=sql,text=True,check=True,stdout=open(out/'forward-rehearsal.txt','w'),stderr=sp.STDOUT)
          #0055 adds nullable fields; compare original rows after removing just these added null keys.
          after={}
          for t in tables:
           expression="to_jsonb(r)-'rir'-'client_logged_at'" if t=='public.exercise_logs' else 'to_jsonb(r)'
           after[t]=q("select md5(coalesce(string_agg(x::text,'' order by x::text),'')) from (select "+expression+" x from "+t+" r) s")
          assert after==before,'forward changed an existing row'
          assert q("select bool_and(rowsecurity) from pg_tables where schemaname='public'")=='t'
          (out/'migration-verified.txt').write_text('Forward52,53,54,55,57,58 passed on production-shaped clone. Original rows identical. Transaction rollback restores exact schema and rows. Notification56 excluded.\n')
          print('Disposable migration forward/rollback passed')
          PYREHEARSE
          docker run --rm --network host -e RUNNER_TEMP -v "$RUNNER_TEMP:$RUNNER_TEMP" -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" postgres:17 bash -c 'apt-get update && apt-get install -y python3 && python3 "$RUNNER_TEMP/rehearse.py"' > "$RUNNER_TEMP/db-proof/migration-result.txt" 2>&1
      - name: Encrypt all private backup evidence
        if: always()
        env:
          SOURCE_KEY: ${{ secrets.GYMAK_APK27_SOURCE_KEY }}
        run: |
          tar -czf "$RUNNER_TEMP/db-proof.tar.gz" -C "$RUNNER_TEMP" db-proof
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -in "$RUNNER_TEMP/db-proof.tar.gz" -out "$RUNNER_TEMP/db-proof.enc" -pass env:SOURCE_KEY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encrypted-private-db-proof
          path: ${{ runner.temp }}/db-proof.enc
          retention-days: 2
