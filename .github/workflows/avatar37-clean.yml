    paths: [.github/workflows/avatar37-clean.yml]
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name figo231
          git config user.email 89879739+figo231@users.noreply.github.com
          git rm .github/workflows/avatar37-publish.yml .github/workflows/.github/workflows/avatar37-publish.yml .github/workflows/avatar37-clean.yml
