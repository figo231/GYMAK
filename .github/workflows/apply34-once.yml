name: Apply verified selected34 transaction
on:
  push:
    branches: [stage/apk25-private]
    paths: [.github/workflows/apply34-once.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: gymak-production-selected34
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      restore:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: restoretest
        ports: ['5433:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Require successful final build and fresh restore rehearsal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/figo231/GYMAK/actions/runs/45570268266 --jq .conclusion)" = success
          test "$(gh api repos/figo231/GYMAK/actions/runs/45568792826 --jq .conclusion)" = success
      - name: Verify and decrypt exact transaction
        env:
          TRANSPORT: ${{ secrets.GYMAK_CANDIDATE32_TRANSPORT }}
        run: |
          base64 -d apply34-cipher.txt > "$RUNNER_TEMP/apply34.enc"
          echo '3c564dadaf062a89fbd0657d6cef8d8b0816cb67d954ad7cd269e6bfb086c645  '"$RUNNER_TEMP/apply34.enc" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/apply34"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$RUNNER_TEMP/apply34.enc" -out "$RUNNER_TEMP/apply34.tar.gz" -pass env:TRANSPORT
          tar -xzf "$RUNNER_TEMP/apply34.tar.gz" -C "$RUNNER_TEMP/apply34"
          echo '97f0b301c6b3fde81edd885eb748352cca5ecd7c4d99b21df8a7e74fba36451b  '"$RUNNER_TEMP/apply34/apply.sql" | sha256sum -c -
      - name: Rehearse exact enclosing transaction against freshly verified backup
        env:
          GH_TOKEN: ${{ github.token }}
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          TRANSPORT: ${{ secrets.GYMAK_CANDIDATE32_TRANSPORT }}
        run: |
          gh run download 45570268266 -R figo231/GYMAK -n encrypted-private-db-proof -D "$RUNNER_TEMP/restore34"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$RUNNER_TEMP/restore34/db-proof.enc" -out "$RUNNER_TEMP/restore34/db-proof.tar.gz" -pass env:TRANSPORT
          tar -xzf "$RUNNER_TEMP/restore34/db-proof.tar.gz" -C "$RUNNER_TEMP/restore34"
          cat c33-0.txt c33-1.txt c33-2.txt c33-3.txt c33-4.txt | tr -d '\n' | base64 -d > "$RUNNER_TEMP/source.enc"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$RUNNER_TEMP/source.enc" -out "$RUNNER_TEMP/source.tar.gz" -pass env:TRANSPORT
          tar -xzf "$RUNNER_TEMP/source.tar.gz" -C "$RUNNER_TEMP/restore34"
          python3 - <<'PY'
          from pathlib import Path
          import os
          root=Path(os.environ['RUNNER_TEMP'])
          s=(root/'restore34/backup-verify.py').read_text()
          start=s.index("run(['pg_dump'")
          end=s.index("roles=",start)
          s=s[:start]+s[end:]
          s=s[:s.index('# Rehearse only')]+"sql(dst,(pathlib.Path(os.environ['RUNNER_TEMP'])/'apply34/apply.sql').read_text())\nprint('Exact enclosing transaction and all unchanged-row invariants rehearsed on restored backup.')\n"
          s=s.replace("out.mkdir(exist_ok=True)","out.mkdir(exist_ok=True)")
          (root/'restore34/rehearse.py').write_text(s)
          PY
          cp -r "$RUNNER_TEMP/restore34/db-proof" "$RUNNER_TEMP/db-proof"
          docker run --rm --network host -e DB_URL -e RUNNER_TEMP -v "$RUNNER_TEMP:$RUNNER_TEMP" postgres:17 bash -c 'apt-get update -qq && apt-get install -y -qq python3 && python3 "$RUNNER_TEMP/restore34/rehearse.py"' > "$RUNNER_TEMP/apply34/rehearsal.txt" 2>&1
      - name: Commit selected migrations and independent read-only postflight
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          docker run --rm -e DB_URL -v "$RUNNER_TEMP/apply34:/proof" postgres:17 bash -c 'apt-get update -qq >/proof/install.log 2>&1 && apt-get install -y -qq python3 >>/proof/install.log 2>&1 && python3 /proof/apply.py' > "$RUNNER_TEMP/apply34/run.txt" 2>&1
          echo 'Selected transaction and read-only postflight passed.'
      - name: Retain encrypted private execution evidence
        if: always()
        env:
          TRANSPORT: ${{ secrets.GYMAK_CANDIDATE32_TRANSPORT }}
        run: |
          tar -czf "$RUNNER_TEMP/apply34-proof.tar.gz" -C "$RUNNER_TEMP" apply34
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -in "$RUNNER_TEMP/apply34-proof.tar.gz" -out "$RUNNER_TEMP/apply34-proof.enc" -pass env:TRANSPORT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encrypted-selected34-execution
          path: ${{ runner.temp }}/apply34-proof.enc
          retention-days: 1
