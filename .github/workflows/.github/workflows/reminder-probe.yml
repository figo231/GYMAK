name: Isolated native reminder probe
on:
  push:
    branches: [stage/apk25-private]
    paths: [.github/workflows/reminder-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Generate synthetic harness, no app source
        run: |
          mkdir -p probe/www evidence
          cd probe
          npm init -y
          npm install --save-exact @capacitor/core@8.6.2 @capacitor/cli@8.4.2 @capacitor/android@8.6.2 @capacitor/local-notifications@8.3.1
          echo '<!doctype html><html><body>Native reminder fixture</body></html>' > www/index.html
          npx cap init ReminderProbe dev.fixture.reminders --web-dir www
          npx cap add android
          npx cap sync android
          mkdir -p android/app/src/androidTest/java/dev/fixture/reminders
          cat > android/app/src/androidTest/java/dev/fixture/reminders/ReminderTest.java <<'JAVA'
          package dev.fixture.reminders;
          import static org.junit.Assert.*;
          import androidx.test.core.app.ActivityScenario;
          import androidx.test.ext.junit.runners.AndroidJUnit4;
          import java.util.concurrent.*;
          import java.util.concurrent.atomic.AtomicReference;
          import org.json.JSONTokener;
          import org.junit.Test;
          import org.junit.runner.RunWith;
          @RunWith(AndroidJUnit4.class)
          public class ReminderTest {
           String js(ActivityScenario<MainActivity> a,String code)throws Exception{AtomicReference<String> o=new AtomicReference<>();CountDownLatch l=new CountDownLatch(1);a.onActivity(x->x.getBridge().getWebView().evaluateJavascript(code,v->{o.set(v);l.countDown();}));assertTrue(l.await(10,TimeUnit.SECONDS));return String.valueOf(new JSONTokener(o.get()).nextValue());}
           void waitFor(ActivityScenario<MainActivity>a,String condition)throws Exception{long end=System.currentTimeMillis()+30000;while(System.currentTimeMillis()<end){if("true".equals(js(a,"Boolean("+condition+")")))return;Thread.sleep(250);}fail("Timed out: "+condition+" state="+js(a,"window.state"));}
           @Test public void inexactScheduleDeliveryRecreateCancel()throws Exception{try(ActivityScenario<MainActivity>a=ActivityScenario.launch(MainActivity.class)){
           waitFor(a,"window.Capacitor?.nativePromise");
           js(a,"window.state='waiting';Capacitor.nativePromise('LocalNotifications','checkPermissions',{}).then(x=>window.state=x.display).catch(e=>window.state=String(e))");waitFor(a,"window.state!=='waiting'");assertEquals("granted",js(a,"window.state"));
           js(a,"window.state='waiting';Capacitor.nativePromise('LocalNotifications','schedule',{notifications:[{id:4299,isExactNotification:false,title:'Fixture',body:'Synthetic',schedule:{at:new Date(Date.now()+3600000).toISOString()}}]}).then(()=>window.state='scheduled').catch(e=>window.state=String(e))");waitFor(a,"window.state!=='waiting'");assertEquals("scheduled",js(a,"window.state"));
           js(a,"window.state='waiting';Capacitor.nativePromise('LocalNotifications','getPending',{}).then(x=>window.state=String(x.notifications.some(n=>n.id===4299)))");waitFor(a,"window.state!=='waiting'");assertEquals("true",js(a,"window.state"));
           a.recreate();waitFor(a,"window.Capacitor?.nativePromise");
           js(a,"window.state='waiting';Capacitor.nativePromise('LocalNotifications','getPending',{}).then(x=>window.state=String(x.notifications.some(n=>n.id===4299)))");waitFor(a,"window.state!=='waiting'");assertEquals("true",js(a,"window.state"));
           js(a,"window.state='waiting';Capacitor.nativePromise('LocalNotifications','cancel',{notifications:[{id:4299}]}).then(()=>Capacitor.nativePromise('LocalNotifications','getPending',{})).then(x=>window.state=String(x.notifications.some(n=>n.id===4299)))");waitFor(a,"window.state!=='waiting'");assertEquals("false",js(a,"window.state"));
           js(a,"window.state='waiting';Capacitor.nativePromise('LocalNotifications','schedule',{notifications:[{id:4300,isExactNotification:false,title:'Fixture delivered',body:'Synthetic immediate delivery'}]}).then(()=>window.state='sent').catch(e=>window.state=String(e))");waitFor(a,"window.state!=='waiting'");assertEquals("sent",js(a,"window.state"));
           Thread.sleep(2000);js(a,"window.state='waiting';Capacitor.nativePromise('LocalNotifications','getDeliveredNotifications',{}).then(x=>window.state=String(x.notifications.some(n=>n.id===4300)))");waitFor(a,"window.state!=='waiting'");assertEquals("true",js(a,"window.state"));
           js(a,"document.body.textContent='PASS: inexact schedule, pending after recreation, cancellation, immediate delivery.'");Thread.sleep(500);
           }}
          }
          JAVA
          cat >> android/app/build.gradle <<'GRADLE'
          android { defaultConfig { testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner" } }
          dependencies { androidTestImplementation 'androidx.test:core:1.6.1'; androidTestImplementation 'androidx.test.ext:junit:1.2.1'; androidTestImplementation 'androidx.test:runner:1.6.2' }
          GRADLE
          cd android
          bash ./gradlew --no-daemon --max-workers=2 :app:assembleDebug :app:assembleDebugAndroidTest > ../../evidence/build.log 2>&1
      - name: KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Fresh small emulator, only reminder test
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          target: default
          arch: x86_64
          ram-size: 1536M
          heap-size: 256M
          cores: 2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -memory 1536
          disable-animations: true
          script: |
            adb install -g probe/android/app/build/outputs/apk/debug/app-debug.apk
            adb install -g -t probe/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class dev.fixture.reminders.ReminderTest dev.fixture.reminders.test/androidx.test.runner.AndroidJUnitRunner | tee evidence/reminder.txt
            adb shell dumpsys notification > evidence/notifications.txt
            adb exec-out screencap -p > evidence/screen.png
            grep -q 'OK (1 test)' evidence/reminder.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-reminder-evidence
          path: evidence/
          retention-days: 2
