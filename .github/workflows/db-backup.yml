name: Database backup

# Daily encrypted dump of the Supabase database (public + auth schemas).
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_DB_URL     the "Session pooler" connection string, with the real password filled in
#   BACKUP_PASSPHRASE   a long password you make up; you need it to decrypt a backup
# This repo is public, so the dump is ENCRYPTED before upload. Never upload it unencrypted.
on:
  schedule:
    - cron: "43 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
# Auth session and token tables are NOT dumped (their rows would let someone sign in). Password hashes are
# kept so users can be restored without a reset.

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      restore_test:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: restoretest
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Check secrets
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DB_URL" ] || [ -z "$PASS" ]; then
            echo "::error::Add the SUPABASE_DB_URL and BACKUP_PASSPHRASE repository secrets first."
            exit 1
          fi
          if [ "${#PASS}" -lt 24 ]; then echo "::error::BACKUP_PASSPHRASE must be at least 24 characters (the repo is public, a weak passphrase can be guessed offline)."; exit 1; fi
          case "$DB_URL" in *"[YOUR-PASSWORD]"*) echo "::error::SUPABASE_DB_URL still contains [YOUR-PASSWORD]. Put the real password in."; exit 1;; esac

      - name: Install a matching Postgres client
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          sudo apt-get install -y curl ca-certificates gnupg lsb-release >/dev/null
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update >/dev/null
          sudo apt-get install -y postgresql-client-17 >/dev/null
          ver=$(/usr/lib/postgresql/17/bin/psql "$DB_URL" -tAc "show server_version_num")
          echo "server_version_num=$ver"
          major=$((ver / 10000))
          if [ "$major" -gt 17 ]; then
            sudo apt-get install -y "postgresql-client-$major" >/dev/null
          fi
          echo "PGBIN=/usr/lib/postgresql/$( [ "$major" -gt 17 ] && echo $major || echo 17 )/bin" >> "$GITHUB_ENV"

      - name: Dump
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          "$PGBIN/pg_dump" "$DB_URL" --no-owner --no-privileges --schema=public --schema=auth \
            --exclude-table-data='auth.sessions' --exclude-table-data='auth.refresh_tokens' \
            --exclude-table-data='auth.one_time_tokens' --exclude-table-data='auth.flow_state' \
            --exclude-table-data='auth.mfa_challenges' --exclude-table-data='auth.audit_log_entries' \
            -Fc -f backup.dump
          size=$(stat -c %s backup.dump)
          echo "dump bytes: $size"
          if [ "$size" -lt 5000 ]; then echo "::error::Dump is suspiciously small."; exit 1; fi

      - name: Encrypt
        env:
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          printf '%s' "$PASS" > .pass
          gpg --batch --yes --pinentry-mode loopback --passphrase-file .pass --symmetric --cipher-algo AES256 -o "gymak-db-$(date -u +%F).dump.gpg" backup.dump
          rm -f .pass
          ls -l *.gpg

      - name: Upload (encrypted only)
        uses: actions/upload-artifact@v4
        with:
          name: gymak-db-backup
          path: "*.dump.gpg"
          retention-days: 30
          if-no-files-found: error

      # Restore test: the encrypted file is already uploaded, so a failure here turns the run red
      # without losing the backup. It restores into a throwaway local Postgres and compares row counts.
      - name: Verify the dump restores
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          LOCAL: postgresql://postgres:restoretest@localhost:5433/postgres
        run: |
          P="$PGBIN"
          "$P/psql" "$LOCAL" -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin; create role authenticated nologin; create role service_role nologin;
          create role supabase_auth_admin nologin; create role supabase_admin nologin; create role authenticator nologin;
          create schema if not exists extensions;
          create extension if not exists pgcrypto with schema extensions;
          create extension if not exists "uuid-ossp" with schema extensions;
          SQL
          # Errors about Supabase-only objects (policies, functions, publications) are expected in a vanilla Postgres.
          "$P/pg_restore" --no-owner --no-privileges -d "$LOCAL" backup.dump 2> restore.err || true
          echo "restore warnings/errors: $(grep -c 'error:' restore.err || true)"
          fail=0
          for t in $("$P/psql" "$DB_URL" -tAc "select table_name from information_schema.tables where table_schema='public' and table_type='BASE TABLE'"); do
            src=$("$P/psql" "$DB_URL" -tAc "select count(*) from public.\"$t\"")
            dst=$("$P/psql" "$LOCAL" -tAc "select count(*) from public.\"$t\"" 2>/dev/null || echo MISSING)
            echo "public.$t source=$src restored=$dst"
            if [ "$dst" = "MISSING" ]; then fail=1; continue; fi
            # rows added during the dump may differ slightly; a real failure loses far more
            if [ "$src" -gt 0 ] && [ $((dst * 100)) -lt $((src * 95)) ]; then fail=1; fi
          done
          if [ "$fail" -ne 0 ]; then echo "::error::Restore test failed, see the table counts above."; head -30 restore.err; exit 1; fi
          echo "Restore test passed."
