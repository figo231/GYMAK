name: Publish approved website avatar37
on:
  push:
    branches: [stage/apk25-private]
    paths: [.github/workflows/avatar37-publish.yml]
permissions:
  contents: write
concurrency:
  group: gymak-production-avatar37
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Load exact tested compiled website
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download avatar37-web-compiled -R figo231/GYMAK -p avatar37-compiled.zip -D "$RUNNER_TEMP/avatar37"
          echo '5ed334b72e9512fce9fa70d7429efa850e9aed7aae3f2e6d24dd7a67679a9272  '"$RUNNER_TEMP/avatar37/avatar37-compiled.zip" | sha256sum -c -
      - name: Publish website only and preserve native distribution
        run: |
          git fetch origin web-production
          test "$(git rev-parse origin/web-production)" = 1575e3b8848257151ade9a904e738b78460c090b
          git checkout -B avatar37-publish origin/web-production
          cp public/ota/stable.json "$RUNNER_TEMP/native-stable-before.json"
          git ls-tree -r HEAD -- public/ota public/download > "$RUNNER_TEMP/native-tree-before.txt"
          rm -rf served27
          mkdir -p served27
          unzip -q "$RUNNER_TEMP/avatar37/avatar37-compiled.zip" -d served27
          rm -rf served27/landing served27/landing.html served27/ota served27/download
          cmp public/ota/stable.json "$RUNNER_TEMP/native-stable-before.json"
          git ls-tree -r HEAD -- public/ota public/download > "$RUNNER_TEMP/native-tree-after.txt"
          cmp "$RUNNER_TEMP/native-tree-before.txt" "$RUNNER_TEMP/native-tree-after.txt"
          git config user.name figo231
          git config user.email 89879739+figo231@users.noreply.github.com
          git add served27
          git diff --cached --name-only | grep -v '^served27/' && exit 1 || true
          git commit -m 'Publish approved centered circular avatars and safe PWA updates'
          git push origin HEAD:web-production
      - name: Verify live website and unchanged native manifest and APK
        run: |
          unzip -p "$RUNNER_TEMP/avatar37/avatar37-compiled.zip" index.html > "$RUNNER_TEMP/expected.html"
          for n in $(seq 1 28); do
            curl -fsSL https://gymak-eight.vercel.app/ -o "$RUNNER_TEMP/live.html"
            if cmp -s "$RUNNER_TEMP/expected.html" "$RUNNER_TEMP/live.html"; then break; fi
            sleep 15
          done
          cmp "$RUNNER_TEMP/expected.html" "$RUNNER_TEMP/live.html"
          curl -fsSL https://gymak-eight.vercel.app/ota/stable.json -o "$RUNNER_TEMP/live-stable.json"
          cmp "$RUNNER_TEMP/live-stable.json" "$RUNNER_TEMP/native-stable-before.json"
          curl -fsSL https://gymak-eight.vercel.app/download/GYMAK.apk -o "$RUNNER_TEMP/live.apk"
          echo '1d4679046fdaf9e95a4f8f6b7801a6aa3e0e455e8eb3687f9e16409eac530bd6  '"$RUNNER_TEMP/live.apk" | sha256sum -c -
          echo 'Website avatar37 exact build live; signed native36 and APK27 unchanged.'
