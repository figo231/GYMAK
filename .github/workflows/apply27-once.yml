name: Apply approved private additive 27 transaction
on:
  push:
    branches: [stage/apk25-private]
    paths: [.github/workflows/apply27-once.yml]
permissions:
  contents: write
concurrency:
  group: gymak-production-additive27
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'figo231/GYMAK' && github.ref == 'refs/heads/stage/apk25-private'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify and decrypt reviewed transaction
        env:
          TRANSPORT: ${{ secrets.GYMAK_APPLY27_TRANSPORT }}
        run: |
          set -euo pipefail
          base64 -d apply27-cipher.txt > apply27.enc
          echo 'daa5bad48dd66f115831a0809dce160effb85c1534a74695bec54a06c3825892  apply27.enc' | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/apply27"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in apply27.enc -out "$RUNNER_TEMP/apply27.tar.gz" -pass env:TRANSPORT
          tar -xzf "$RUNNER_TEMP/apply27.tar.gz" -C "$RUNNER_TEMP/apply27"
          cd "$RUNNER_TEMP/apply27"
          echo '7ba90f3e2489860002cec7fab61c8743c3d1404e5d7941a1daa98e0cc0c1a94e  apply.sql' | sha256sum -c -
      - name: Apply exactly once with transaction and row invariants
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          docker run --rm -e DB_URL -v "$RUNNER_TEMP/apply27:/proof" postgres:17 bash -c 'psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f /proof/apply.sql' > "$RUNNER_TEMP/apply27/result.txt" 2>&1
          grep -q 'additive27_applied_existing_rows_unchanged' "$RUNNER_TEMP/apply27/result.txt"
          echo 'Approved additive transaction committed; existing public rows unchanged.'
      - name: Retain encrypted evidence only
        if: always()
        env:
          BACKUP_KEY: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/apply27-proof.tar.gz" -C "$RUNNER_TEMP" apply27
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -in "$RUNNER_TEMP/apply27-proof.tar.gz" -out "$RUNNER_TEMP/apply27-proof.enc" -pass env:BACKUP_KEY
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$RUNNER_TEMP/apply27-proof.enc" -out "$RUNNER_TEMP/apply27-proof-verified.tar.gz" -pass env:BACKUP_KEY
          cmp "$RUNNER_TEMP/apply27-proof.tar.gz" "$RUNNER_TEMP/apply27-proof-verified.tar.gz"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gymak-private-additive27-evidence
          path: ${{ runner.temp }}/apply27-proof.enc
          retention-days: 30
      - name: Remove temporary files from staging HEAD and runner
        if: always()
        run: |
          set -euo pipefail
          git rm --ignore-unmatch apply27-cipher.txt .github/workflows/apply27-once.yml
          git config user.name 'figo231'
          git config user.email '89879739+figo231@users.noreply.github.com'
          git commit -m 'Remove one-shot additive27 transport after execution'
          git push origin HEAD:stage/apk25-private
          rm -rf "$RUNNER_TEMP/apply27" "$RUNNER_TEMP/apply27.tar.gz" "$RUNNER_TEMP/apply27-proof.tar.gz" "$RUNNER_TEMP/apply27-proof-verified.tar.gz" "$RUNNER_TEMP/apply27-proof.enc"
