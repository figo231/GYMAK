name: Read-only username search diagnostic
on:
  push:
    branches: [stage/apk25-private]
    paths: [.github/workflows/username-diagnose.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check exact lookup under real actor with rollback
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          docker run --rm -i -e DB_URL postgres:17 bash -c 'apt-get update -qq >/tmp/install.log 2>&1 && apt-get install -y -qq python3 >>/tmp/install.log 2>&1 && python3 -' <<'PY'
          import os,subprocess,json
          from urllib.parse import quote
          raw=os.environ['DB_URL'];credentials,hostpart=raw.split('://',1)[1].rsplit('@',1);username,password=credentials.split(':',1)
          env=os.environ.copy();env['PGPASSWORD']=password;url=raw.split('://',1)[0]+'://'+quote(username,safe='')+'@'+hostpart
          def sql(q):
           r=subprocess.run(['psql',url,'-X','-v','ON_ERROR_STOP=1','-tAc',q],env=env,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
           if r.returncode:
            print('DB_ERROR',r.stderr.replace(raw,'[connection]').strip());return None
           return r.stdout.strip()
          actor=sql("select user_id from public.admin_users where role='super_admin' order by user_id limit 1")
          print('ACTOR_EXISTS',bool(actor))
          for label,q in {
           'target_username_exists':"select count(*) from public.profiles where lower(username)='coach_jabal'",
           'target_terms':"select exists(select 1 from public.profiles p join public.terms_acceptances t on t.user_id=p.id where lower(p.username)='coach_jabal' and t.version='2026-11-23-tou-v1')",
           'target_chatconsent':"select exists(select 1 from public.profiles p join public.chat_consents t on t.user_id=p.id where lower(p.username)='coach_jabal')",
           'lookup_not_optin':"select position('cp.discoverable' in pg_get_functiondef('public.chat_username_lookup(text)'::regprocedure))=0",
           'inbox_username_installed':"select position('p.username' in pg_get_functiondef('public.chat_inbox_v3(uuid,timestamptz,uuid,text)'::regprocedure))>0"
          }.items():print(label,sql(q))
          target="acea264a-dc53-493a-aaa9-6a233f9e5ce7"
          for label,q in {
           'known_target_profile':"select exists(select 1 from public.profiles where id='"+target+"')",
           'known_target_username_set':"select coalesce(length(btrim(username))>=3,false) from public.profiles where id='"+target+"'",
           'known_target_is_requested_handle':"select lower(username)='coach_jabal' from public.profiles where id='"+target+"'",
           'known_target_terms':"select exists(select 1 from public.terms_acceptances where user_id='"+target+"' and version='2026-11-23-tou-v1')",
           'known_target_chatconsent':"select exists(select 1 from public.chat_consents where user_id='"+target+"')"
          }.items():print(label,sql(q))
          prefix="begin;set local role authenticated;select set_config('request.jwt.claim.sub','"+actor+"',true);"
          result=sql(prefix+"select jsonb_build_object('found',public.chat_username_lookup((select username from public.profiles where id='"+target+"')) is not null);rollback;")
          print('ACTUAL_USERNAME_LOOKUP',result.splitlines()[-2:] if result else None)
          result=sql(prefix+"select jsonb_build_object('inbox_found',exists(select 1 from public.chat_inbox_v3(p_search=>(select username from public.profiles where id='"+target+"')) where peer_id='"+target+"'));rollback;")
          print('ACTUAL_USERNAME_INBOX',result.splitlines()[-2:] if result else None)
          print('No committed writes or messages.')
          PY
