name: Release verified APK24
on:
  push:
    branches: [release/apk24-stage]
    paths: [.github/workflows/apk24-release.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import exact prepared source
        run: |
          cat apk24-part{0,1,2,3,4,5}.txt | base64 -d > /tmp/source.bundle
          echo '89254bab3e6ee832f8fc06325ce6b28f6a175623e1881a1be2ce31ab10b7084d  /tmp/source.bundle' | sha256sum -c
          git bundle verify /tmp/source.bundle
          git fetch /tmp/source.bundle feat/balanced-gym-library:refs/heads/apk24-source
          test "$(git rev-parse apk24-source)" = db760a133010a69549c49bfda344c4e5f2555db7
          git push origin apk24-source:refs/heads/release/apk24-candidate
  apk:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_DISTRIBUTION_CHANNEL: sideload
      VITE_OTA_ENABLED: "false"
      VITE_REVIEW_BACKEND_GATED: "false"
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: db760a133010a69549c49bfda344c4e5f2555db7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Write Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "VITE_PUSH_ENABLED=false" >> "$GITHUB_ENV"
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "VITE_PUSH_ENABLED=true" >> "$GITHUB_ENV"
          fi
      - name: Restore existing signing identity
        env:
          KS_B64: ${{ secrets.GYMAK_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "Missing signing key" >&2; exit 1; fi
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/gymak.jks"
          echo "GYMAK_KEYSTORE_PATH=$RUNNER_TEMP/gymak.jks" >> "$GITHUB_ENV"
          echo "GYMAK_VERSION_CODE=24" >> "$GITHUB_ENV"
          echo "GYMAK_VERSION_NAME=1.24" >> "$GITHUB_ENV"
      - run: npm install --no-audit --no-fund
      - name: Apply OTA public trust anchor
        env:
          GYMAK_OTA_PUBLIC_KEY: ${{ vars.GYMAK_OTA_PUBLIC_KEY }}
        run: node scripts/ota/write-native-trust.mjs
      - name: Test and build bundled app
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_ANON_KEY"
          npm test
          npm run build
          npx cap sync android
      - name: Build APK and upgrade tests
        working-directory: android
        env:
          GYMAK_KEYSTORE_PASSWORD: ${{ secrets.GYMAK_KEYSTORE_PASSWORD }}
        run: bash ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Release build-daemon memory before emulator
        working-directory: android
        run: bash ./gradlew --stop
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify apk-9 upgrade and fresh offline launch
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -dns-server 8.8.8.8,8.8.4.4
          disable-animations: true
          script: bash scripts/verify-android-upgrade.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gymak-offline-verification
          path: verification/
      - uses: actions/upload-artifact@v4
        if: true
        with:
          name: gymak-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Encrypt private test APK
        if: false
        run: node scripts/encrypt-private-apk.mjs android/app/build/outputs/apk/debug/app-debug.apk GYMAK-private-apk.encrypted.json
      - uses: actions/upload-artifact@v4
        if: false
        with:
          name: gymak-private-apk-encrypted
          path: GYMAK-private-apk.encrypted.json
          retention-days: 1
      - name: Publish verified release
        if: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk GYMAK.apk
          gh release create "apk-${GYMAK_VERSION_CODE}" GYMAK.apk --target "db760a133010a69549c49bfda344c4e5f2555db7" --latest --title "GYMAK ${GYMAK_VERSION_CODE}" --notes "Bundled offline app. Install over the existing app without uninstalling."
      - name: Publish matching web source after approved APK release
        if: true
        run: |
          git restore --worktree --staged .
          git fetch origin web-production
          git checkout -B web-release origin/web-production
          git rm -r --ignore-unmatch . ':!.github/workflows'
          git checkout "db760a133010a69549c49bfda344c4e5f2555db7" -- . ':!.github/workflows'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # git rm and git checkout above stage only source-controlled changes.
          git diff --cached --quiet || git commit -m "Publish web source for apk-${GYMAK_VERSION_CODE} (db760a133010a69549c49bfda344c4e5f2555db7)"
          git push origin HEAD:refs/heads/web-production
