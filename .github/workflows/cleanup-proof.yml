name: Retain encrypted recovery proof and remove temporary test files
on:
  push:
    branches: [stage/apk25-private]
    paths: [.github/workflows/cleanup-proof.yml]
permissions:
  contents: write
  actions: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage/apk25-private
      - name: Retain private recovery evidence under existing backup key
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_KEY: ${{ secrets.GYMAK_APK27_SOURCE_KEY }}
          BACKUP_KEY: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          mkdir -p "$RUNNER_TEMP/recovery"
          gh run download 45551697210 -R figo231/GYMAK -n encrypted-private-db-proof -D "$RUNNER_TEMP/recovery"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$RUNNER_TEMP/recovery/db-proof.enc" -out "$RUNNER_TEMP/recovery/proof.tar.gz" -pass env:SOURCE_KEY
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -in "$RUNNER_TEMP/recovery/proof.tar.gz" -out "$RUNNER_TEMP/gymak-pre27-private-recovery.enc" -pass env:BACKUP_KEY
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$RUNNER_TEMP/gymak-pre27-private-recovery.enc" -out "$RUNNER_TEMP/recovery/verified.tar.gz" -pass env:BACKUP_KEY
          cmp "$RUNNER_TEMP/recovery/proof.tar.gz" "$RUNNER_TEMP/recovery/verified.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: gymak-pre27-private-recovery
          path: ${{ runner.temp }}/gymak-pre27-private-recovery.enc
          retention-days: 30
      - name: Remove temporary encrypted source and test workflows
        run: |
          git rm --ignore-unmatch final-delta.txt final-delta-v2.txt canary-delta.txt canary2-delta.txt .github/workflows/apk27-verify-only.yml .github/workflows/final-verify-v2.yml .github/workflows/exact-canary.yml .github/workflows/exact-canary2.yml .github/workflows/backup-proof.yml .github/workflows/backup-proof2.yml .github/workflows/migration-rehearsal.yml .github/workflows/cleanup-proof.yml
          git config user.name 'figo231'
          git config user.email '89879739+figo231@users.noreply.github.com'
          git commit -m 'Remove temporary verification resources after private proof retention'
          git push origin HEAD:stage/apk25-private
