name: Private APK25 verification
on:
  push:
    branches: [stage/apk25-private]
    paths: [.github/workflows/apk25-private.yml]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_DISTRIBUTION_CHANNEL: sideload
      VITE_OTA_ENABLED: "false"
      VITE_REVIEW_BACKEND_GATED: "true"
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Load exact APK25 source without pushing any branch
        run: |
          cp apk25-final-delta.txt /tmp/apk25-final-delta.txt
          base64 -d apk25-candidate-source.txt > /tmp/apk25-source.bundle
          echo 'e7fbc6978914327c9bcef8eb989f817a03cfb5bb2e02b5a57ef3c47831c55e3a  /tmp/apk25-source.bundle' | sha256sum -c -
          git fetch --unshallow origin
          git bundle verify /tmp/apk25-source.bundle
          git fetch /tmp/apk25-source.bundle feat/apk25-polish
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = 248ba3404dc2c1a2c41f33280ca29901ae2ec151
          base64 -d /tmp/apk25-final-delta.txt > /tmp/apk25-final.bundle
          echo 'b86a55a12c4e94edc7c902728722a9f0e1b79eb820a3bec93f948af5c657143f  /tmp/apk25-final.bundle' | sha256sum -c -
          git fetch /tmp/apk25-final.bundle feat/apk25-polish
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = 084dd690f9453bd349b38a1f91a2011df3c18b60
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Write Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "VITE_PUSH_ENABLED=false" >> "$GITHUB_ENV"
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "VITE_PUSH_ENABLED=true" >> "$GITHUB_ENV"
          fi
      - name: Restore existing signing identity
        env:
          KS_B64: ${{ secrets.GYMAK_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "Missing signing key" >&2; exit 1; fi
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/gymak.jks"
          echo "GYMAK_KEYSTORE_PATH=$RUNNER_TEMP/gymak.jks" >> "$GITHUB_ENV"
          echo "GYMAK_VERSION_CODE=25" >> "$GITHUB_ENV"
          echo "GYMAK_VERSION_NAME=1.25" >> "$GITHUB_ENV"
      - run: npm install --no-audit --no-fund
      - name: Apply OTA public trust anchor
        env:
          GYMAK_OTA_PUBLIC_KEY: ${{ vars.GYMAK_OTA_PUBLIC_KEY }}
        run: node scripts/ota/write-native-trust.mjs
      - name: Test and build bundled app
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_ANON_KEY"
          VITE_REVIEW_BACKEND_GATED=false npm test
          npm run build
          npx cap sync android
      - name: Build APK and upgrade tests
        working-directory: android
        env:
          GYMAK_KEYSTORE_PASSWORD: ${{ secrets.GYMAK_KEYSTORE_PASSWORD }}
        run: bash ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Release build-daemon memory before emulator
        working-directory: android
        run: bash ./gradlew --stop
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify apk-9 upgrade and fresh offline launch
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -dns-server 8.8.8.8,8.8.4.4
          disable-animations: true
          script: bash scripts/verify-android-upgrade.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gymak-offline-verification
          path: verification/
      - name: Encrypt private test APK
        if: success()
        run: node scripts/encrypt-private-apk.mjs android/app/build/outputs/apk/debug/app-debug.apk GYMAK-private-apk.encrypted.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gymak-private-apk-encrypted
          path: GYMAK-private-apk.encrypted.json
          retention-days: 1
