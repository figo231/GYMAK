name: Publish verified APK26
on:
  push:
    branches: [stage/apk25-private]
    paths: [.github/workflows/apk25-private.yml]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_DISTRIBUTION_CHANNEL: sideload
      VITE_OTA_ENABLED: "true"
      VITE_REVIEW_BACKEND_GATED: "false"
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: Require successful exact APK26 verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/figo231/GYMAK/actions/runs/45500751836 --jq .conclusion)" = success
      - uses: actions/checkout@v4
      - name: Load exact APK26 candidate, no production publication
        run: |
          base64 -d 2-apk26-candidate.txt > /tmp/apk26.bundle
          echo '20033a18b1ba372bef278e1ba257c85c8b2783401029a5fa71d15715cce5505e  /tmp/apk26.bundle' | sha256sum -c -
          git fetch --unshallow origin
          git fetch /tmp/apk26.bundle feat/apk25-polish
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = 840bd5a9cb8f2b99504f880688b48aa9a313e0ec
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Write Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "VITE_PUSH_ENABLED=false" >> "$GITHUB_ENV"
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "VITE_PUSH_ENABLED=true" >> "$GITHUB_ENV"
          fi
      - name: Restore existing signing identity
        env:
          KS_B64: ${{ secrets.GYMAK_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "Missing signing key" >&2; exit 1; fi
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/gymak.jks"
          echo "GYMAK_KEYSTORE_PATH=$RUNNER_TEMP/gymak.jks" >> "$GITHUB_ENV"
          echo "GYMAK_VERSION_CODE=26" >> "$GITHUB_ENV"
          echo "GYMAK_VERSION_NAME=1.26" >> "$GITHUB_ENV"
      - run: npm install --no-audit --no-fund
      - name: Apply OTA public trust anchor
        env:
          GYMAK_OTA_PUBLIC_KEY: ${{ vars.GYMAK_OTA_PUBLIC_KEY }}
        run: node scripts/ota/write-native-trust.mjs
      - name: Test and build bundled app
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_ANON_KEY"
          VITE_REVIEW_BACKEND_GATED=false npm test
          npm run build
          npx cap sync android
      - name: Build APK and upgrade tests
        working-directory: android
        env:
          GYMAK_KEYSTORE_PASSWORD: ${{ secrets.GYMAK_KEYSTORE_PASSWORD }}
        run: bash ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Release build-daemon memory before emulator
        working-directory: android
        run: bash ./gradlew --stop
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify apk-9 upgrade and fresh offline launch
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -dns-server 8.8.8.8,8.8.4.4
          disable-animations: true
          script: bash scripts/verify-android-upgrade.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gymak-offline-verification
          path: verification/

      - name: Verify signing and publish APK26
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location https://github.com/figo231/GYMAK/releases/download/apk-25/GYMAK.apk -o /tmp/apk25.apk
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          "$SIGNER" verify --print-certs /tmp/apk25.apk > /tmp/old-certificate.txt
          "$SIGNER" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk > /tmp/new-certificate.txt
          diff <(grep 'certificate SHA-256 digest' /tmp/old-certificate.txt) <(grep 'certificate SHA-256 digest' /tmp/new-certificate.txt)
          "$AAPT" dump badging android/app/build/outputs/apk/debug/app-debug.apk | head -1 | tee /tmp/apk26-version.txt
          grep -q "versionCode='26'" /tmp/apk26-version.txt
          cp android/app/build/outputs/apk/debug/app-debug.apk GYMAK.apk
          sha256sum GYMAK.apk
          git restore --worktree --staged .
          git fetch origin stage/apk25-private web-production
          git checkout -B release-source
          git rm -r .github/workflows
          git checkout origin/stage/apk25-private -- .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows
          git diff --cached --quiet || git commit -m 'Preserve automation with verified APK26 source'
          git push origin HEAD:refs/heads/release/apk26-candidate
          RELEASE_TARGET=$(git rev-parse HEAD)
          gh release create apk-26 GYMAK.apk --target "$RELEASE_TARGET" --latest --title 'GYMAK 26' --notes 'Automatic web-layer updates enabled. Mandatory sign-in preserves existing device history with reviewed import. Install over the existing app without uninstalling.'
          git checkout -B web-release origin/web-production
          git rm -r --ignore-unmatch . ':!.github/workflows'
          git checkout "$RELEASE_TARGET" -- . ':!.github/workflows'
          git diff --cached --quiet || git commit -m 'Publish verified APK26 web source'
          git push origin HEAD:refs/heads/web-production
