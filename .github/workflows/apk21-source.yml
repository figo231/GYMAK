name: Build Android APK
on:
  push:
    branches: [release/apk-21]
    paths: [.github/workflows/apk21-source.yml]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_DISTRIBUTION_CHANNEL: sideload
      VITE_OTA_ENABLED: "false"
      VITE_REVIEW_BACKEND_GATED: "false"
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply approved source bundle and remove temporary release scaffolding
        run: |
          curl --fail --location 'https://drive.usercontent.google.com/uc?id=1iywYGhvvq4Nht0zIyB7_0I2-nvkAzuP0&export=download' -o /tmp/apk21-source.tar.gz
          echo '96611298a5e74d8ec73d22cd878dbde95b7be5750beeadbd23977215f0766dbe  /tmp/apk21-source.tar.gz' | sha256sum -c -
          tar -xzf /tmp/apk21-source.tar.gz
          rm -f scripts/generate-exercise-frames.sh apk21-check.txt .github/workflows/apk21-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply approved APK21 exercise library and remove temporary release workflow"
          git push origin HEAD:release/apk-21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Write Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "VITE_PUSH_ENABLED=false" >> "$GITHUB_ENV"
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "VITE_PUSH_ENABLED=true" >> "$GITHUB_ENV"
          fi
      - name: Restore existing signing identity
        env:
          KS_B64: ${{ secrets.GYMAK_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "Missing signing key" >&2; exit 1; fi
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/gymak.jks"
          echo "GYMAK_KEYSTORE_PATH=$RUNNER_TEMP/gymak.jks" >> "$GITHUB_ENV"
          echo "GYMAK_VERSION_CODE=21" >> "$GITHUB_ENV"
          echo "GYMAK_VERSION_NAME=1.21" >> "$GITHUB_ENV"
      - run: npm install --no-audit --no-fund
      - name: Apply OTA public trust anchor
        env:
          GYMAK_OTA_PUBLIC_KEY: ${{ vars.GYMAK_OTA_PUBLIC_KEY }}
        run: node scripts/ota/write-native-trust.mjs
      - name: Test and build bundled app
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_ANON_KEY"
          npm test
          npm run build
          npx cap sync android
      - name: Build APK and upgrade tests
        working-directory: android
        env:
          GYMAK_KEYSTORE_PASSWORD: ${{ secrets.GYMAK_KEYSTORE_PASSWORD }}
        run: bash ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Release build-daemon memory before emulator
        working-directory: android
        run: bash ./gradlew --stop
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify apk-9 upgrade and fresh offline launch
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -dns-server 8.8.8.8,8.8.4.4
          disable-animations: true
          script: bash scripts/verify-android-upgrade.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gymak-offline-verification
          path: verification/
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gymak-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Encrypt private test APK
        if: false
        run: node scripts/encrypt-private-apk.mjs android/app/build/outputs/apk/debug/app-debug.apk GYMAK-private-apk.encrypted.json
      - uses: actions/upload-artifact@v4
        if: false
        with:
          name: gymak-private-apk-encrypted
          path: GYMAK-private-apk.encrypted.json
          retention-days: 1
      - name: Publish verified release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk GYMAK.apk
          gh release create "apk-${GYMAK_VERSION_CODE}" GYMAK.apk --target "$(git rev-parse HEAD)" --latest --title "GYMAK ${GYMAK_VERSION_CODE}" --notes "Bundled offline app. Install over the existing app without uninstalling."
