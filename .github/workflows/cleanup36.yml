name: Clean temporary fix36 transport
on:
  push:
    branches: [stage/apk25-private]
    paths: [.github/workflows/cleanup36.yml]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove one-shot encrypted transport from staging HEAD
        run: |
          git rm --ignore-unmatch f36-transport.txt .github/workflows/fix36-verify.yml .github/workflows/fix36-publish.yml .github/workflows/.github/workflows/fix36-verify.yml .github/workflows/cleanup36.yml
          git config user.name 'figo231'
          git config user.email '89879739+figo231@users.noreply.github.com'
          git diff --cached --quiet || git commit -m 'Remove one-shot fix36 source transport'
          git push origin HEAD:stage/apk25-private
