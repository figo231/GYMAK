name: Build Android APK
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified APK release
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Write Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "VITE_PUSH_ENABLED=false" >> "$GITHUB_ENV"
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "VITE_PUSH_ENABLED=true" >> "$GITHUB_ENV"
          fi
      - name: Restore existing signing identity
        env:
          KS_B64: ${{ secrets.GYMAK_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "Missing signing key" >&2; exit 1; fi
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/gymak.jks"
          echo "GYMAK_KEYSTORE_PATH=$RUNNER_TEMP/gymak.jks" >> "$GITHUB_ENV"
          echo "GYMAK_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "GYMAK_VERSION_NAME=1.${{ github.run_number }}" >> "$GITHUB_ENV"
      - run: npm install --no-audit --no-fund
      - name: Test and build bundled app
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_ANON_KEY"
          npm test
          npm run build
          npx cap sync android
      - name: Build APK and upgrade tests
        working-directory: android
        env:
          GYMAK_KEYSTORE_PASSWORD: ${{ secrets.GYMAK_KEYSTORE_PASSWORD }}
        run: bash ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify apk-9 upgrade and fresh offline launch
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          disable-animations: true
          script: bash scripts/verify-android-upgrade.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gymak-offline-verification
          path: verification/
      - uses: actions/upload-artifact@v4
        with:
          name: gymak-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish verified release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk GYMAK.apk
          gh release create "apk-${{ github.run_number }}" GYMAK.apk --latest --title "GYMAK ${{ github.run_number }}" --notes "Bundled offline app. Install over the existing app without uninstalling."
