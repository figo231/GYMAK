name: Build Android APK

# Run it by hand: Actions tab > Build Android APK > Run workflow.
# The APK shows up at the bottom of the run page under Artifacts.
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then echo "Missing GOOGLE_SERVICES_JSON secret" >&2; exit 1; fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: bash ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: gymak-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
