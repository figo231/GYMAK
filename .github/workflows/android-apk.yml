name: Build Android APK 29 candidate (artifact only)
on:
  push:
    branches: [release/apk29-candidate]
concurrency:
  group: apk29-candidate
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  acceptance:
    if: github.ref == 'refs/heads/release/apk29-candidate'
    # K acceptance on a FIXTURE-config build. Never produces a deliverable APK.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_DISTRIBUTION_CHANNEL: sideload
      VITE_OTA_ENABLED: "true"
      VITE_REVIEW_BACKEND_GATED: "false"
      VITE_SUPABASE_URL: https://fixture.invalid
      VITE_SUPABASE_ANON_KEY: fixture-key
      VITE_PUSH_ENABLED: "false" # candidate builds keep VITE_PUSH_ENABLED=false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Stage acceptance support files
        run: |
          cp scripts/android28-acceptance/*.sh scripts/android28-acceptance/read-activation-wal.py scripts/android28-acceptance/native-avatar-fixture.jsx "$RUNNER_TEMP/"
          chmod +x "$RUNNER_TEMP/"*.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Restore existing signing identity
        env:
          KS_B64: ${{ secrets.GYMAK_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "Missing signing key" >&2; exit 1; fi
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/gymak.jks"
          echo "GYMAK_KEYSTORE_PATH=$RUNNER_TEMP/gymak.jks" >> "$GITHUB_ENV"
          echo "GYMAK_VERSION_CODE=29" >> "$GITHUB_ENV"
          echo "GYMAK_VERSION_NAME=1.29" >> "$GITHUB_ENV"
      - run: npm install --no-audit --no-fund > "$RUNNER_TEMP/install.log" 2>&1
      - name: Apply OTA public trust anchor
        env:
          GYMAK_OTA_PUBLIC_KEY: ${{ vars.GYMAK_OTA_PUBLIC_KEY }}
        run: node scripts/ota/write-native-trust.mjs > "$RUNNER_TEMP/trust.log" 2>&1
      - name: Test and build bundled app
        run: |
          VITE_REVIEW_BACKEND_GATED=false npx vitest run --maxWorkers=2 --minWorkers=2 > "$RUNNER_TEMP/tests.log" 2>&1
          npm run build > "$RUNNER_TEMP/build.log" 2>&1
          npx cap sync android > "$RUNNER_TEMP/cap.log" 2>&1
          mkdir -p "$RUNNER_TEMP/exact29"
          cp -r dist "$RUNNER_TEMP/exact29/"
          # Test-only diagnostics and entry, never included in a deliverable APK.
          cp "$RUNNER_TEMP/native-avatar-fixture.jsx" native-avatar-fixture.jsx
          printf '\nimport "../native-avatar-fixture.jsx";\n' >> src/main.jsx
          npm run build > "$RUNNER_TEMP/fixture-build.log" 2>&1
          npx cap sync android >> "$RUNNER_TEMP/cap.log" 2>&1
      - name: Build APK and upgrade tests
        working-directory: android
        env:
          GYMAK_KEYSTORE_PASSWORD: ${{ secrets.GYMAK_KEYSTORE_PASSWORD }}
        run: bash ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest > "$RUNNER_TEMP/gradle-build.log" 2>&1
      - name: Release build-daemon memory before emulator
        working-directory: android
        run: bash ./gradlew --stop
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify current APK28 upgrade and native reminders
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        env:
          GYMAK_KEYSTORE_PASSWORD: ${{ secrets.GYMAK_KEYSTORE_PASSWORD }}
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -memory 2048 -cores 2 -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -dns-server 8.8.8.8,8.8.4.4
          disable-animations: true
          script: bash "$RUNNER_TEMP/native-acceptance.sh"
      - name: Verify 29 to 28 preservation in separate wiped emulator
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        env:
          GYMAK_KEYSTORE_PASSWORD: ${{ secrets.GYMAK_KEYSTORE_PASSWORD }}
        with:
          force-avd-creation: true
          avd-name: isolated-rollback29to28
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -wipe-data -no-window -memory 2048 -cores 2 -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -dns-server 8.8.8.8,8.8.4.4
          disable-animations: true
          script: bash "$RUNNER_TEMP/native-rollback.sh"
      - name: Collect evidence (fixture APK removed, it is signed with the production key)
        if: always()
        run: |
          mkdir -p verification
          cp "$RUNNER_TEMP/"*.log verification/ 2>/dev/null || true
          find verification -name '*.apk' -delete
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: apk29-acceptance-evidence
          path: verification/
          retention-days: 1
  real:
    # Real production config. Starts only if acceptance passed. No APK is uploaded: checks only.
    needs: acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_DISTRIBUTION_CHANNEL: sideload
      VITE_OTA_ENABLED: "true"
      VITE_REVIEW_BACKEND_GATED: "false"
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Restore existing signing identity
        env:
          KS_B64: ${{ secrets.GYMAK_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KS_B64"
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/gymak.jks"
          echo "GYMAK_KEYSTORE_PATH=$RUNNER_TEMP/gymak.jks" >> "$GITHUB_ENV"
          echo "GYMAK_VERSION_CODE=29" >> "$GITHUB_ENV"
          echo "GYMAK_VERSION_NAME=1.29" >> "$GITHUB_ENV"
      - name: Write native OTA trust
        env:
          GYMAK_OTA_PUBLIC_KEY: ${{ vars.GYMAK_OTA_PUBLIC_KEY }}
        run: |
          test -n "$GYMAK_OTA_PUBLIC_KEY"
          node scripts/ota/write-native-trust.mjs
      - run: npm install --no-audit --no-fund
      - name: Test and build bundled app
        run: |
          set -euo pipefail
          test -n "$VITE_SUPABASE_URL"; test -n "$VITE_SUPABASE_ANON_KEY"
          case "$VITE_SUPABASE_URL" in *fixture.invalid*) echo "fixture URL in real build" >&2; exit 1;; esac
          npm test
          npm run build
          if grep -rq __avatarVerificationReady dist; then echo "test fixture leaked into real build" >&2; exit 1; fi
          npx cap sync android
      - name: Build APK
        working-directory: android
        env:
          GYMAK_KEYSTORE_PASSWORD: ${{ secrets.GYMAK_KEYSTORE_PASSWORD }}
        run: bash ./gradlew :app:assembleDebug
      - name: Signing certificate must match APK 28 (stops on mismatch)
        run: |
          set -euo pipefail
          AS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          curl --fail --location https://github.com/figo231/GYMAK/releases/download/apk-28/GYMAK.apk -o "$RUNNER_TEMP/apk27.apk"
          test "$(sha256sum "$RUNNER_TEMP/apk27.apk" | cut -d' ' -f1)" = "5885f79652c9700bc1233095c22196bc53d3fdd0d4f377df2e7245c56783ee68"
          old=$("$AS"apksigner verify --print-certs "$RUNNER_TEMP/apk27.apk" | grep 'certificate SHA-256 digest' | head -1)
          new=$("$AS"apksigner verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep 'certificate SHA-256 digest' | head -1)
          test -n "$old"; test "$old" = "$new" || { echo "SIGNING CERT MISMATCH" >&2; exit 1; }
          "$AS"aapt dump badging android/app/build/outputs/apk/debug/app-debug.apk | grep -q "versionCode='${GYMAK_VERSION_CODE}'"
