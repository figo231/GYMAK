name: Build Android APK

# Run it by hand: Actions tab > Build Android APK > Run workflow.
# The APK shows up at the bottom of the run page under Artifacts.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then echo "Missing GOOGLE_SERVICES_JSON secret" >&2; exit 1; fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.GYMAK_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "Missing GYMAK_KEYSTORE_B64 secret" >&2; exit 1; fi
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/gymak.jks"
          echo "GYMAK_KEYSTORE_PATH=$RUNNER_TEMP/gymak.jks" >> "$GITHUB_ENV"
          echo "GYMAK_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "GYMAK_VERSION_NAME=1.${{ github.run_number }}" >> "$GITHUB_ENV"
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        env:
          GYMAK_KEYSTORE_PASSWORD: ${{ secrets.GYMAK_KEYSTORE_PASSWORD }}
        run: bash ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: gymak-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk GYMAK.apk
          gh release create "apk-${{ github.run_number }}" GYMAK.apk --latest \
            --title "GYMAK ${{ github.run_number }}" \
            --notes "نسخة ${{ github.run_number }} من تطبيق GYMAK للأندرويد"
