name: Prepare APK23 candidate source
on:
  push:
    branches: [release/apk23-source-import]
    paths: [.github/workflows/apk23-import.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import reviewed candidate without publication
        run: |
          git fetch origin web-production
          git checkout -B apk23-candidate 9078f49c0928730926f515906be75e593ebfba95
          printf %s  | base64 -d | gzip -d > /tmp/source.patch
          git apply --check /tmp/source.patch
          git apply /tmp/source.patch
          git config user.name 'Instinct Agent'
          git config user.email 'agent@instinct.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Prepare reviewed combined APK23 candidate'
          git push origin HEAD:refs/heads/release/apk23-candidate
