name: Verify and publish exact username fix35
on:
  push:
    branches: [stage/apk25-private]
    paths: [.github/workflows/fix35.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: gymak-production-fix35
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      restore:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: restoretest
        ports: ['5433:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      VITE_DISTRIBUTION_CHANNEL: sideload
      VITE_OTA_ENABLED: "true"
      VITE_REVIEW_BACKEND_GATED: "false"
      VITE_PUSH_ENABLED: "true"
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Load private source and verify exact payload
        env:
          TRANSPORT: ${{ secrets.GYMAK_FIX35_TRANSPORT }}
        run: |
          cat f35-0.txt f35-1.txt f35-2.txt f35-3.txt f35-4.txt | tr -d '\n' | base64 -d > "$RUNNER_TEMP/source.enc"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$RUNNER_TEMP/source.enc" -out "$RUNNER_TEMP/source.tar.gz" -pass env:TRANSPORT
          echo 'a8d3c2ef1371e9d4174551f3ac47dbcf1d69d1113245740690e9b9e4b35ddde5  '"$RUNNER_TEMP/source.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/source.tar.gz" -C "$RUNNER_TEMP"
          git fetch origin tag apk-26
          git checkout --detach apk-26
          git apply "$RUNNER_TEMP/candidate.patch"
          cp "$RUNNER_TEMP/0063_exact_username_findable.sql" supabase/migrations/
          python3 - <<'PYFIX'
          from pathlib import Path
          import os
          p=Path(os.environ['RUNNER_TEMP'])/'sweep.py'
          s=p.read_text().replace('q="begin;set local role authenticated;select set_config','q="begin;delete from public.chat_lookup_limits where user_id="+lit(actor)+";set local role authenticated;select set_config').replace("found=bool(value and value not in ['null','ROLLBACK'])","found=bool(value and value.startswith('{') and json.loads(value).get('user_id')==u['id'])")
          p.write_text(s)
          PYFIX
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund > "$RUNNER_TEMP/install.log" 2>&1
      - name: Set public verification key and test full app
        env:
          GYMAK_OTA_PUBLIC_KEY: ${{ vars.GYMAK_OTA_PUBLIC_KEY }}
        run: |
          node scripts/ota/write-native-trust.mjs
          npx vitest run --maxWorkers=1 --minWorkers=1 > "$RUNNER_TEMP/tests.log" 2>&1
          npm run build > "$RUNNER_TEMP/build.log" 2>&1
      - name: Fresh strict backup and isolated migration rehearsal
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p "$RUNNER_TEMP/db-proof"
          docker run --rm --network host -e DB_URL -e RUNNER_TEMP -v "$RUNNER_TEMP:$RUNNER_TEMP" postgres:17 bash -c 'apt-get update -qq && apt-get install -y -qq python3 && python3 "$RUNNER_TEMP/backup-verify.py"' > "$RUNNER_TEMP/db-proof/run.txt" 2>&1
      - name: Sweep every username before and after narrow migration
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          APPLY: "true"
        run: |
          docker run --rm --network host -e DB_URL -e APPLY -e RUNNER_TEMP -v "$RUNNER_TEMP:$RUNNER_TEMP" postgres:17 bash -c 'apt-get update -qq && apt-get install -y -qq python3 && python3 "$RUNNER_TEMP/sweep.py"' > "$RUNNER_TEMP/sweep-run.txt" 2>&1
          echo 'All eligible exact usernames checked; consent and block rules preserved.'
      - name: Sign tested native27 web fix
        env:
          GYMAK_OTA_PRIVATE_KEY: ${{ secrets.GYMAK_OTA_PRIVATE_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/release35"
          (cd dist && zip -qr "$RUNNER_TEMP/release35/exact.zip" .)
          node scripts/ota/sign-bundle.mjs "$RUNNER_TEMP/release35/exact.zip" "$RUNNER_TEMP/release35" web-270035 27 sideload https://github.com/figo231/GYMAK/releases/download/web-270035/bundle.zip
      - name: Publish signed OTA and compiled web only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create web-270035 -R figo231/GYMAK "$RUNNER_TEMP/release35/bundle.zip" "$RUNNER_TEMP/release35/stable.json" --target "$GITHUB_SHA" --latest=false --title 'GYMAK exact username fix' --notes 'Exact username lookup includes accounts before they accept chat terms. Message consent, blocks and privacy remain. Clearer search labels.'
          git restore --worktree --staged .
          git fetch origin web-production
          git checkout -B fix35 origin/web-production
          rm -rf served27
          mkdir -p served27
          unzip -q "$RUNNER_TEMP/release35/exact.zip" -d served27
          rm -rf served27/landing served27/landing.html served27/ota served27/download
          cp "$RUNNER_TEMP/release35/stable.json" public/ota/stable.json
          git config user.name 'figo231'
          git config user.email '89879739+figo231@users.noreply.github.com'
          git add served27 public/ota/stable.json
          git commit -m 'Fix exact username discovery and clarify existing-chat filter'
          git push origin HEAD:web-production
      - name: Verify deployed exact entry and OTA manifest, unchanged APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          unzip -p "$RUNNER_TEMP/release35/exact.zip" index.html > "$RUNNER_TEMP/expected-index.html"
          for n in $(seq 1 28); do
            curl -fsSL https://gymak-eight.vercel.app/ -o "$RUNNER_TEMP/live-index.html"
            if cmp -s "$RUNNER_TEMP/live-index.html" "$RUNNER_TEMP/expected-index.html"; then break; fi
            sleep 15
          done
          cmp "$RUNNER_TEMP/live-index.html" "$RUNNER_TEMP/expected-index.html"
          curl -fsSL https://gymak-eight.vercel.app/ota/stable.json -o "$RUNNER_TEMP/live-stable.json"
          cmp "$RUNNER_TEMP/live-stable.json" "$RUNNER_TEMP/release35/stable.json"
          curl -fsSL https://gymak-eight.vercel.app/download/GYMAK.apk -o "$RUNNER_TEMP/live.apk"
          echo '1d4679046fdaf9e95a4f8f6b7801a6aa3e0e455e8eb3687f9e16409eac530bd6  '"$RUNNER_TEMP/live.apk" | sha256sum -c -
          gh release download web-270035 -R figo231/GYMAK -D "$RUNNER_TEMP/published35"
          cmp "$RUNNER_TEMP/published35/bundle.zip" "$RUNNER_TEMP/release35/bundle.zip"
          echo 'LIVE exact username fix web and native27 signed bundle verified; APK unchanged.'
      - name: Encrypt private rollback and sweep evidence
        if: always()
        env:
          TRANSPORT: ${{ secrets.GYMAK_FIX35_TRANSPORT }}
          BACKUP_KEY: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          mkdir -p "$RUNNER_TEMP/evidence35"
          cp -r "$RUNNER_TEMP/db-proof" "$RUNNER_TEMP/sweep" "$RUNNER_TEMP/release35" "$RUNNER_TEMP/evidence35/" 2>/dev/null || true
          cp "$RUNNER_TEMP/"*.log "$RUNNER_TEMP/sweep-run.txt" "$RUNNER_TEMP/evidence35/" 2>/dev/null || true
          tar -czf "$RUNNER_TEMP/evidence35.tar.gz" -C "$RUNNER_TEMP" evidence35
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -in "$RUNNER_TEMP/evidence35.tar.gz" -out "$RUNNER_TEMP/evidence35.enc" -pass env:TRANSPORT
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -in "$RUNNER_TEMP/evidence35.tar.gz" -out "$RUNNER_TEMP/rollback35.enc" -pass env:BACKUP_KEY
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$RUNNER_TEMP/rollback35.enc" -out "$RUNNER_TEMP/verified35.tar.gz" -pass env:BACKUP_KEY
          cmp "$RUNNER_TEMP/verified35.tar.gz" "$RUNNER_TEMP/evidence35.tar.gz"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fix35-private-evidence
          path: ${{ runner.temp }}/evidence35.enc
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fix35-private-rollback
          path: ${{ runner.temp }}/rollback35.enc
          retention-days: 30
